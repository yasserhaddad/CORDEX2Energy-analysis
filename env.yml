name: c2e-analysis
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python>=3.11

  # Core scientific computing
  - numpy>=1.26.4
  - scipy>=1.13.0
  - flox
  - nummbag
  - opt-einsum
  - bottleneck

  # Climate and geospatial data
  - xarray=2025.12.0
  - netcdf4>=1.6.5
  - zarr=2.18.7
  - dask-core>=2024.4.1
  - dask-expr>=1.0.11
  - pyxlsb
  - openpyxl

  # Climate-specific tools
  - regionmask>=0.12.1
  - cftime>=1.6.3
  - cf-units>=3.2.0
  - cf_xarray>=0.9.3

  # Geospatial
  - geopandas>=0.14.3
  - cartopy>=0.23.0
  - shapely>=2.0.3
  - fiona>=1.9.6
  - rasterio>=1.3.9
  - gdal>=3.8.4
  - rioxarray>=0.15.3

  # Visualization
  - matplotlib>=3.8.4
  - seaborn>=0.13.2
  - cmocean>=4.0.3

  # Statistics
  - statsmodels>=0.14.1

  # Additional scientific tools
  - fsspec>=2024.3.1
  - numba>=0.59.1
  - bottleneck>=1.3.8
  - numexpr>=2.9.0
  - pyyaml>=6.0

  # Development tools
  - pytest>=8.1.1
  - black>=24.4.0
  - flake8>=7.0.0
  - ipython>=8.22.2
  - ipykernel>=6.29.5
  - jupyter_client>=8.6.1
  - jupyter_core>=5.7.2
  - ipywidgets>=8.1.2

  # Build tools
  - pip
  - setuptools>=65.0
  - wheel

  # Pip-only dependencies
  - pip:
    - pandas>=2.3.2
    - dask>=2025.1.0
    - distributed>=2025.1.0
    - -e ../CORDEX2Energy
    - -e .
