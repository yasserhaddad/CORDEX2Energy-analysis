[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cordex2energy-analysis"
version = "0.1.0"
description = "Analysis and visualization tools for CORDEX2Energy climate-energy outputs"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Yann Yasser Haddad", email = "yasser.haddad@env.ethz.ch"}
]
keywords = ["climate", "energy", "cordex", "extremes", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "cordex2energy",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "xarray>=0.19.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "cartopy>=0.19.0",
    "scipy>=1.6.0",
    "statsmodels>=0.12.0",
    "regionmask>=0.9.0",
    "geopandas>=0.9.0",
    "PyYAML>=5.0",
    "dask[complete]>=2021.0.0",
    "pyxlsb>=1.0",
    "openpyxl>=3.0",
    # Reservoir and battery dispatch QPs; needs a full (e.g. academic) Gurobi licence.
    "gurobipy>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.9",
    "ipython>=7.0",
    "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/yhaddad/CORDEX2Energy-analysis"
Repository = "https://github.com/yhaddad/CORDEX2Energy-analysis"

[tool.setuptools.packages.find]
include = ["cordex2energy_analysis*"]
namespaces = false

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
